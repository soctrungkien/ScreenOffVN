name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release for this build'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare workspace
        run: |
          chmod +x gradlew
          # local.properties is committed with a Windows SDK path, remove it so
          # Gradle uses ANDROID_HOME from the runner instead.
          rm -f local.properties

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*versionName[[:space:]]*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle | sed -E 's/.*versionCode[[:space:]]*([0-9]+).*/\1/')
          echo "name=${VERSION_NAME:-dev}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE:-0}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Collect APK
        run: |
          mkdir -p dist
          APK="ScreenOffVN-${{ steps.version.outputs.name }}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          ls -lh dist

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenOffVN-release-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: ScreenOffVN ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          body: |
            Automated release build.

            - Version name: `${{ steps.version.outputs.name }}`
            - Version code: `${{ steps.version.outputs.code }}`
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
