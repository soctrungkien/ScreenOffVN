name: Build Debug APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare workspace
        run: |
          # gradlew was committed with Windows CRLF endings, which breaks the
          # shebang (#!/usr/bin/env sh\r) on Linux runners.
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          # local.properties is committed with a Windows SDK path, remove it so
          # Gradle uses ANDROID_HOME from the runner instead.
          rm -f local.properties

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*versionName[[:space:]]*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle | sed -E 's/.*versionCode[[:space:]]*([0-9]+).*/\1/')
          echo "name=${VERSION_NAME:-dev}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE:-0}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          APK="ScreenOffVN-${{ steps.version.outputs.name }}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK"
          ls -lh dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenOffVN-debug-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
